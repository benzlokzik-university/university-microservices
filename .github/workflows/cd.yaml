name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        service: [gateway, booking]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./code/services/${{ matrix.service }}
          file: ./code/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        service: [gateway, booking]
    steps:
      - uses: actions/checkout@v6

      - name: Get version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(date +'%Y%m%d')-${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create ${{ matrix.service }} release
        uses: softprops/action-gh-release@v1
        with:
          tag: ${{ matrix.service }}-${{ steps.version.outputs.version }}
          name: ${{ matrix.service }} ${{ steps.version.outputs.version }}
          body: |
            ${{ matrix.service }} service release

            **Image Tags:**
            - `ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest`
            - `ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}-${{ github.sha }}`

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
