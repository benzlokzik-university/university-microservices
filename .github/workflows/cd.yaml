name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for booking
        id: meta-booking
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/booking
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./code/services/gateway
          file: ./code/services/gateway/Dockerfile
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push booking image
        uses: docker/build-push-action@v5
        with:
          context: ./code/services/booking
          file: ./code/services/booking/Dockerfile
          push: true
          tags: ${{ steps.meta-booking.outputs.tags }}
          labels: ${{ steps.meta-booking.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(date +'%Y%m%d')-${GITHUB_SHA:0:7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create gateway release
        uses: softprops/action-gh-release@v1
        with:
          tag: gateway-${{ steps.version.outputs.version }}
          name: Gateway ${{ steps.version.outputs.version }}
          body: |
            Gateway service release

            **Image Tags:**
            - `ghcr.io/${{ github.repository }}/gateway:latest`
            - `ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}-${{ github.sha }}`

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create booking release
        uses: softprops/action-gh-release@v1
        with:
          tag: booking-${{ steps.version.outputs.version }}
          name: Booking ${{ steps.version.outputs.version }}
          body: |
            Booking service release

            **Image Tags:**
            - `ghcr.io/${{ github.repository }}/booking:latest`
            - `ghcr.io/${{ github.repository }}/booking:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository }}/booking:${{ github.ref_name }}-${{ github.sha }}`

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
