services:
  # RabbitMQ for async event-driven communication
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Account Database
  user-account-db:
    image: postgres:15-alpine
    container_name: user-account-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_account
    ports:
      - "5433:5432"
    volumes:
      - user-account-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Game Catalog Database
  game-catalog-db:
    image: postgres:15-alpine
    container_name: game-catalog-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_catalog
    ports:
      - "5434:5432"
    volumes:
      - game-catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rent Database
  rent-db:
    image: postgres:15-alpine
    container_name: rent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rent
    ports:
      - "5435:5432"
    volumes:
      - rent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Account Service
  user-account:
    build:
      context: ./code/services/user-account
      dockerfile: Dockerfile
    container_name: user-account-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@user-account-db:5432/user_account
      SECRET_KEY: your-secret-key-change-in-production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      user-account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Game Catalog Service
  game-catalog:
    build:
      context: ./code/services/game-catalog
      dockerfile: Dockerfile
    container_name: game-catalog-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@game-catalog-db:5432/game_catalog
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      game-catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Booking Service
  booking:
    build:
      context: ./code/services/booking
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8003:8003"
    environment:
      USER_ACCOUNT_SERVICE_URL: http://user-account:8001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      user-account:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Payment Service
  payment:
    build:
      context: ./code/services/payment
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8004:8004"
      - "50051:50051"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Rent Service
  rent:
    build:
      context: ./code/services/rent
      dockerfile: Dockerfile
    container_name: rent-service
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@rent-db:5432/rent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_SERVICE_GRPC_URL: payment:50051
      BOOKING_SERVICE_URL: http://booking:8003
      GAME_CATALOG_SERVICE_URL: http://game-catalog:8002
      USER_ACCOUNT_SERVICE_URL: http://user-account:8001
    depends_on:
      rent-db:
        condition: service_healthy
      payment:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Rating Service
  rating:
    build:
      context: ./code/services/rating
      dockerfile: Dockerfile
    container_name: rating-service
    ports:
      - "8006:8006"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      GAME_CATALOG_SERVICE_URL: http://game-catalog:8002
    depends_on:
      game-catalog:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  gateway:
    build:
      context: ./code/services/gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8000:8000"
    depends_on:
      - user-account
      - game-catalog
      - booking
      - payment
      - rent
      - rating
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./grafana/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Postgres Exporter - User Account
  postgres-exporter-user-account:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-user-account
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@user-account-db:5432/user_account?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - user-account-db

  # Postgres Exporter - Game Catalog
  postgres-exporter-game-catalog:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-game-catalog
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@game-catalog-db:5432/game_catalog?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      - game-catalog-db

  # Postgres Exporter - Rent
  postgres-exporter-rent:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-rent
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@rent-db:5432/rent?sslmode=disable"
    ports:
      - "9189:9187"
    depends_on:
      - rent-db

  # RabbitMQ Exporter
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: rabbitmq-exporter
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      PUBLISH_PORT: 9419
    ports:
      - "9419:9419"
    depends_on:
      - rabbitmq

volumes:
  user-account-db-data:
  game-catalog-db-data:
  rent-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
